<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 13px; color: #1f2937; margin: 0; padding: 14px; background: #fff; }
  h2 { font-size: 12px; color: #6b7280; font-weight: bold; margin: 18px 0 8px; letter-spacing: .04em; }
  .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; }
  .muted { color: #6b7280; font-size: 12px; }
  .id { font-size: 12px; color: #6b7280; }
  .title { font-size: 15px; font-weight: bold; margin: 2px 0 2px; }
  .row { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #f1f5f9; }
  .row span:first-child { color: #6b7280; }
  .total { font-size: 18px; font-weight: bold; margin: 8px 0 4px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: bold; }
  .s-期限超過 { background: #fde8e8; color: #b42318; } .s-未入金 { background: #fff4e5; color: #b54708; }
  .s-一部入金 { background: #e8f0fe; color: #1d4ed8; } .s-入金済 { background: #e7f6ec; color: #067647; }
  .s-未請求, .s-失注 { background: #f3f4f6; color: #4b5563; } .s-見積中 { background: #eef2ff; color: #4338ca; } .s-受注 { background: #e7f6ec; color: #067647; }
  button { width: 100%; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; padding: 8px 10px; font-size: 13px; cursor: pointer; text-align: left; margin-bottom: 6px; font-family: inherit; }
  button:hover { background: #f8fafc; }
  button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  button.primary:hover { background: #1a5fd0; }
  button:disabled { opacity: .5; cursor: default; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid button { margin: 0; text-align: center; }
  label { display: block; font-size: 12px; color: #6b7280; margin: 6px 0 2px; }
  input, select { width: 100%; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; font-family: inherit; }
  .msg { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 12px; display: none; white-space: pre-wrap; }
  .msg.ok { display: block; background: #e7f6ec; color: #067647; }
  .msg.err { display: block; background: #fde8e8; color: #b42318; }
  .msg a { color: inherit; font-weight: bold; }
  .alert { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid #f3f4f6; }
  .alert b { color: #b42318; }
  .kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .kpi div { background: #f8fafc; border-radius: 6px; padding: 8px; }
  .kpi strong { display: block; font-size: 15px; }
  .confirm { border: 1px solid #fcd34d; background: #fffbeb; border-radius: 6px; padding: 8px; margin: 6px 0; display: none; font-size: 12px; }
</style>
</head>
<body>
  <div class="muted">シートで案件の行を選ぶと、ここに表示されます。</div>

  <h2>選択中の案件</h2>
  <div id="deal" class="card"><span class="muted">読み込み中…</span></div>

  <div id="actions" style="display:none">
    <h2>書類</h2>
    <div class="grid">
      <button id="b-quote" onclick="act('quote')">見積書PDF</button>
      <button id="b-invoice" class="primary" onclick="act('invoice')">請求書PDF</button>
    </div>
    <div id="confirm" class="confirm">
      <div id="confirm-text"></div>
      <div class="grid" style="margin-top:6px"><button onclick="confirmYes()">作り直す</button><button onclick="hideConfirm()">やめる</button></div>
    </div>
    <h2>メール下書き（送信はしません）</h2>
    <div class="grid">
      <button onclick="act('draftQuote')">見積メール</button>
      <button onclick="act('draftInvoice')">請求メール</button>
    </div>
    <h2>入金を記録</h2>
    <div class="card">
      <label>入金日</label><input id="p-date" type="date">
      <label>入金額（空欄なら残額すべて）</label><input id="p-amount" type="number" min="1" step="1" placeholder="残額">
      <label>入金方法</label>
      <select id="p-method"><option>銀行振込</option><option>口座振替</option><option>現金</option><option>相殺</option><option>その他</option></select>
      <div style="margin-top:8px"><button class="primary" style="text-align:center" onclick="pay()">入金を記録する</button></div>
    </div>
  </div>
  <div id="msg" class="msg"></div>

  <h2>未入金アラート</h2>
  <div id="alerts" class="card"><span class="muted">読み込み中…</span></div>
  <div style="margin-top:8px"><button onclick="act('reminders', {}, true)">期限超過分の督促メール下書きを作成</button></div>

<script>
  var state = null;
  var pending = null;
  var lastKey = '';

  function yen(n) { return n === '' || n === null || n === undefined ? '-' : '¥' + Math.round(n).toLocaleString('ja-JP'); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  function load() {
    google.script.run.withSuccessHandler(render).withFailureHandler(function (e) { show(false, e.message); }).panelGetState();
  }

  function render(s) {
    state = s;
    var d = s.deal;
    var key = d ? [d.row, d.quoteNo, d.invoiceNo, d.paid, d.total, d.mailDraft, d.hasQuotePdf, d.hasInvoicePdf].join('|') : s.hint;
    if (key !== lastKey) {
      lastKey = key;
      var el = document.getElementById('deal');
      if (!d) {
        el.innerHTML = '<span class="muted">' + esc(s.hint) + '</span>';
        document.getElementById('actions').style.display = 'none';
      } else {
        el.innerHTML =
          '<div class="id">' + esc(d.id) + '　<span class="chip s-' + esc(d.orderStatus) + '">' + esc(d.orderStatus) + '</span> <span class="chip s-' + esc(d.status) + '">' + esc(d.status) + '</span></div>' +
          '<div class="title">' + esc(d.subject) + '</div><div class="muted">' + esc(d.customer) + '</div>' +
          '<div class="total">' + yen(d.total) + ' <span class="muted">税込</span></div>' +
          '<div class="row"><span>税抜 / 消費税</span><span>' + yen(d.subtotal) + ' / ' + yen(d.tax) + '</span></div>' +
          '<div class="row"><span>明細</span><span>' + d.lineCount + '行</span></div>' +
          '<div class="row"><span>見積</span><span>' + (d.quoteNo ? esc(d.quoteNo) + (d.hasQuotePdf ? '（PDFあり）' : '') : '未作成') + '</span></div>' +
          '<div class="row"><span>請求</span><span>' + (d.invoiceNo ? esc(d.invoiceNo) + (d.hasInvoicePdf ? '（PDFあり）' : '') : '未発行') + '</span></div>' +
          (d.dueOn ? '<div class="row"><span>支払期限</span><span>' + esc(d.dueOn) + (d.days !== '' ? (d.days > 0 ? '（<b style="color:#b42318">' + d.days + '日超過</b>）' : '（あと' + (-d.days) + '日）') : '') + '</span></div>' : '') +
          (d.invoiceNo ? '<div class="row"><span>入金済 / 残高</span><span>' + yen(d.paid) + ' / ' + yen(d.balance) + '</span></div>' : '') +
          (d.mailDraft ? '<div class="row"><span>メール</span><span>' + esc(d.mailDraft) + '</span></div>' : '');
        document.getElementById('actions').style.display = 'block';
        document.getElementById('b-quote').textContent = d.hasQuotePdf ? '見積書を再作成' : '見積書PDF';
        document.getElementById('b-invoice').textContent = d.hasInvoicePdf ? '請求書を再発行' : '請求書PDF';
      }
    }
    var a = s.alerts;
    var al = document.getElementById('alerts');
    if (!a) { al.innerHTML = '<span class="muted">-</span>'; return; }
    al.innerHTML =
      '<div class="kpi"><div><span class="muted">期限超過</span><strong style="color:#b42318">' + a.overdueCount + '件 ' + yen(a.overdueAmount) + '</strong></div>' +
      '<div><span class="muted">期限間近</span><strong>' + a.soonCount + '件 ' + yen(a.soonAmount) + '</strong></div></div>' +
      a.items.map(function (i) {
        return '<div class="alert"><span>' + esc(i.customer) + '<br><span class="muted">' + esc(i.invoiceNo) + '</span></span><span style="text-align:right">' + yen(i.balance) + '<br>' +
          (i.level === 'overdue' ? '<b>' + i.days + '日超過</b>' : '<span class="muted">あと' + (-i.days) + '日</span>') + '</span></div>';
      }).join('') +
      '<div class="muted" style="margin-top:6px">毎朝の自動チェック：' + (s.triggerOn ? 'オン' : 'オフ') + '</div>';
  }

  function show(ok, text, url, urlLabel) {
    var m = document.getElementById('msg');
    m.className = 'msg ' + (ok ? 'ok' : 'err');
    m.innerHTML = esc(text) + (url ? '<br><a href="' + esc(url) + '" target="_blank">' + esc(urlLabel || '開く') + '</a>' : '');
  }

  function setBusy(b) {
    var buttons = document.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = b;
  }

  function act(action, extra, noRow) {
    if (!noRow && !(state && state.deal)) return;
    var payload = extra || {};
    if (!noRow) payload.row = state.deal.row;
    setBusy(true);
    show(true, '処理中です…');
    google.script.run.withSuccessHandler(function (r) {
      setBusy(false);
      if (r.needsConfirm) {
        pending = { action: action, payload: payload };
        document.getElementById('confirm-text').textContent = r.number + ' のPDFは作成済みです。同じ番号で作り直しますか？（古いPDFはゴミ箱へ）';
        document.getElementById('confirm').style.display = 'block';
        document.getElementById('msg').className = 'msg';
        return;
      }
      if (!r.ok) { show(false, r.error); return; }
      if (action === 'quote' || action === 'invoice') show(true, r.number + ' を作成しました（' + yen(r.total) + '）', r.url, 'PDFを開く');
      else if (action === 'draftQuote' || action === 'draftInvoice') show(true, '下書きを作成しました（送信はしていません）\n宛先：' + r.to, 'https://mail.google.com/mail/u/0/#drafts', 'Gmail の下書きを開く');
      else if (action === 'payment') show(true, r.invoiceNo + ' に ' + yen(r.amount) + ' の入金を記録しました\n入金後：' + r.statusAfter + (r.balanceAfter > 0 ? '（残高 ' + yen(r.balanceAfter) + '）' : ''));
      else if (action === 'reminders') show(true, r.results.filter(function (x) { return x.ok; }).length + '件の督促メール下書きを作成しました（送信はしていません）', 'https://mail.google.com/mail/u/0/#drafts', 'Gmail の下書きを開く');
      lastKey = '';
      load();
    }).withFailureHandler(function (e) { setBusy(false); show(false, e.message); }).panelAction(action, payload);
  }

  function confirmYes() {
    hideConfirm();
    if (!pending) return;
    pending.payload.force = true;
    act(pending.action, pending.payload);
    pending = null;
  }
  function hideConfirm() { document.getElementById('confirm').style.display = 'none'; }

  function pay() {
    var amount = document.getElementById('p-amount').value;
    act('payment', { paidOn: document.getElementById('p-date').value, amount: amount === '' ? '' : Number(amount), method: document.getElementById('p-method').value });
    document.getElementById('p-amount').value = '';
  }

  document.getElementById('p-date').value = today();
  load();
  // 選択の変更に追従（画面が表示されているときだけ）
  setInterval(function () { if (!document.hidden) load(); }, 5000);
</script>
</body>
</html>
